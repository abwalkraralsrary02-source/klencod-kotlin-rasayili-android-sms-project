name: Build Android APK (بناء تطبيق رسائلي تلقائياً)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. تنزيل كود المشروع (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة جافا (Set up JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. إعداد أدوات أندرويد (Set up Android SDK)
        uses: android-actions/setup-android@v3

      - name: 4. إعداد جرادل (Set up Gradle 8.7)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. منح صلاحية التنفيذ لـ Gradle Wrapper
        run: |
          chmod +x gradlew || true

      - name: 6. تجميع وبناء ملف APK (Assemble Debug APK)
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: 7. رفع ملف الـ APK الجاهز للتثبيت على هاتفك (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Rasayili-SMS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
